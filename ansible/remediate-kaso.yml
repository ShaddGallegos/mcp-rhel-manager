---
# Remediation playbook for kaso.prod.spg
# Generated from HAL health check on 2026-04-28
# Issues addressed:
#   - Critical: CPU over-temperature (100°C)
#   - Warning:  Intel SOF audio firmware missing
#   - Warning:  Unmaintained kernel drivers (cnic/bnx2i) — informational only
#   - Warning:  Audit subsystem not running
#   - Warning:  Available package updates
#   - Warning:  v4l2loopback module missing
#   - Warning:  mcp-ai-remediator.service failing
#
# NOTE: SELinux remains PERMISSIVE per baseline configuration.
# NOTE: CPU temperature is a hardware issue; playbook applies SW mitigations only.
# NOTE: cnic/bnx2i drivers are logged but NOT blacklisted until usage is verified.

- name: Remediate kaso.prod.spg — HAL health check findings
  hosts: localhost
  become: true
  gather_facts: true

  vars:
    # Set to true to allow 'dnf upgrade' — leave false for review-first approach
    allow_system_upgrade: false
    # Set to true to blacklist cnic/bnx2i after manual verification they are unused
    blacklist_legacy_network_drivers: false

  tasks:

    # ─── 1. CPU THERMAL MITIGATION ────────────────────────────────────────────
    - name: "[CRITICAL] CPU thermal — install cpupower tools"
      ansible.builtin.package:
        name:
          - kernel-tools
        state: present
      tags: [ cpu, thermal ]

    - name: "[CRITICAL] CPU thermal — set powersave governor to reduce heat"
      ansible.builtin.command:
        cmd: cpupower frequency-set -g powersave
      changed_when: true
      check_mode: false
      tags: [ cpu, thermal ]
      ignore_errors: true

    - name: "[CRITICAL] CPU thermal — show top CPU consumers"
      ansible.builtin.shell: |
        ps -eo pid,ppid,comm,%cpu --sort=-%cpu | head -15
      register: top_procs
      changed_when: false
      tags: [ cpu, thermal ]

    - name: "[CRITICAL] CPU thermal — report top consumers"
      ansible.builtin.debug:
        msg: "{{ top_procs.stdout_lines }}"
      tags: [ cpu, thermal ]

    # ─── 2. INTEL SOF AUDIO FIRMWARE ─────────────────────────────────────────
    - name: "[WARNING] Audio — install sof-firmware"
      ansible.builtin.package:
        name:
          - linux-firmware
          - alsa-sof-firmware
        state: present
      ignore_errors: true
      tags: [ audio, firmware ]
      register: sof_installed

    - name: "[WARNING] Audio — restart audio services after firmware install"
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
      loop:
        - pipewire
        - pipewire-pulse
        - wireplumber
      ignore_errors: true
      when: sof_installed.changed
      tags: [ audio, firmware ]

    # ─── 3. AUDIT SUBSYSTEM ───────────────────────────────────────────────────
    - name: "[WARNING] Audit — install auditd"
      ansible.builtin.package:
        name:
          - audit
          - audit-libs
        state: present
      tags: [ security, audit ]

    - name: "[WARNING] Audit — enable and start auditd"
      ansible.builtin.systemd:
        name: auditd
        enabled: true
        state: started
      tags: [ security, audit ]

    - name: "[WARNING] Audit — deploy baseline audit rules"
      ansible.builtin.copy:
        dest: /etc/audit/rules.d/99-baseline.rules
        content: |
          # Baseline audit rules — generated by HAL remediation
          # Record authentication events
          -w /var/log/faillog -p wa -k auth
          -w /var/log/lastlog -p wa -k auth
          # Record user/group changes
          -w /etc/passwd -p wa -k identity
          -w /etc/group -p wa -k identity
          -w /etc/shadow -p wa -k identity
          -w /etc/sudoers -p wa -k sudoers
          -w /etc/sudoers.d/ -p wa -k sudoers
          # Record privilege escalation
          -a always,exit -F arch=b64 -S setuid -S setgid -k privilege_escalation
          # Record network changes
          -w /etc/hosts -p wa -k network
          # Record MCP AI activity (local only)
          -w /usr/local/bin/mcp-ai-runner -p x -k mcp_ai
        owner: root
        group: root
        mode: "0640"
      notify: Reload audit rules
      tags: [ security, audit ]

    # ─── 4. V4L2LOOPBACK MODULE ───────────────────────────────────────────────
    - name: "[WARNING] v4l2loopback — check if kmod available"
      ansible.builtin.command:
        cmd: dnf info kmod-v4l2loopback
      register: v4l2_info
      changed_when: false
      failed_when: false
      tags: [ kernel, modules ]

    - name: "[WARNING] v4l2loopback — install if available"
      ansible.builtin.package:
        name: kmod-v4l2loopback
        state: present
      when: v4l2_info.rc == 0
      tags: [ kernel, modules ]

    - name: "[WARNING] v4l2loopback — suppress module-load failure if unavailable"
      ansible.builtin.lineinfile:
        path: /etc/modules-load.d/v4l2loopback.conf
        line: "# v4l2loopback intentionally disabled — not available on this kernel"
        create: true
        regexp: "^v4l2loopback"
      when: v4l2_info.rc != 0
      tags: [ kernel, modules ]

    - name: "[WARNING] v4l2loopback — remove from module-load if absent"
      ansible.builtin.file:
        path: /etc/modules-load.d/v4l2loopback.conf
        state: absent
      when: v4l2_info.rc != 0
      tags: [ kernel, modules ]

    # ─── 5. MCP-AI-REMEDIATOR SERVICE ────────────────────────────────────────
    - name: "[WARNING] mcp-ai-remediator — check if service file exists"
      ansible.builtin.stat:
        path: /etc/systemd/system/mcp-ai-remediator.service
      register: remediator_svc
      tags: [ mcp, services ]

    - name: "[WARNING] mcp-ai-remediator — show journal on failure"
      ansible.builtin.command:
        cmd: journalctl -u mcp-ai-remediator.service -n 30 --no-pager
      register: remediator_journal
      changed_when: false
      failed_when: false
      when: remediator_svc.stat.exists
      tags: [ mcp, services ]

    - name: "[WARNING] mcp-ai-remediator — report journal output"
      ansible.builtin.debug:
        msg: "{{ remediator_journal.stdout_lines }}"
      when: remediator_svc.stat.exists
      tags: [ mcp, services ]

    # ─── 6. OPTIONAL: LEGACY NETWORK DRIVER BLACKLIST ───────────────────────
    - name: "[INFO] cnic/bnx2i — check if drivers loaded"
      ansible.builtin.command:
        cmd: lsmod
      register: lsmod_out
      changed_when: false
      tags: [ drivers, network ]

    - name: "[INFO] cnic/bnx2i — report loaded status"
      ansible.builtin.debug:
        msg: >
          cnic loaded: {{ 'cnic' in lsmod_out.stdout }}, bnx2i loaded: {{
          'bnx2i' in lsmod_out.stdout }}. Set
          blacklist_legacy_network_drivers=true after verifying they are unused.
      tags: [ drivers, network ]

    - name: "[INFO] cnic/bnx2i — blacklist if confirmed unused"
      ansible.builtin.copy:
        dest: /etc/modprobe.d/blacklist-legacy-net.conf
        content: |
          # Blacklisted by HAL remediation — unmaintained drivers
          blacklist cnic
          blacklist bnx2i
        owner: root
        group: root
        mode: "0644"
      when: blacklist_legacy_network_drivers | bool
      tags: [ drivers, network ]

    # ─── 7. PACKAGE UPDATES ──────────────────────────────────────────────────
    - name: "[INFO] Packages — check available updates"
      ansible.builtin.command:
        cmd: dnf check-update --quiet
      register: dnf_updates
      changed_when: false
      failed_when: dnf_updates.rc not in [0, 100]
      tags: [ packages, updates ]

    - name: "[INFO] Packages — show pending updates"
      ansible.builtin.debug:
        msg: |
          {{ dnf_updates.stdout_lines | default(['No pending updates found.']) }}
          To apply: re-run with -e allow_system_upgrade=true
      tags: [ packages, updates ]

    - name: "[INFO] Packages — apply updates (if allow_system_upgrade=true)"
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true
      when: allow_system_upgrade | bool
      tags: [ packages, updates ]

    # ─── 8. SELINUX STATUS — PRESERVED PER BASELINE CONFIG ───────────────────
    - name: "[SKIPPED] SELinux — preserving Permissive per baseline policy"
      ansible.builtin.debug:
        msg: >
          SELinux is Permissive — this is intentional per your baseline
          configuration. To enforce: setenforce 1 && sed -i
          's/^SELINUX=.*/SELINUX=enforcing/' /etc/selinux/config
      tags: [ security, selinux ]

  # ─── HANDLERS ────────────────────────────────────────────────────────────
  handlers:
    - name: Reload audit rules
      ansible.builtin.command:
        cmd: augenrules --load
      ignore_errors: true
