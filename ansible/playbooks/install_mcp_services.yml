- name: Install MCP model management and services
  hosts: all
  become: true
  vars:
    mcp_install_paths:
      - src: packaging/tmpfiles.d/mcp-llms.conf
        dest: /etc/tmpfiles.d/mcp-llms.conf
      - src: packaging/systemd/mcp-model-cleanup.service
        dest: /etc/systemd/system/mcp-model-cleanup.service
      - src: packaging/systemd/mcp-model-cleanup.timer
        dest: /etc/systemd/system/mcp-model-cleanup.timer
    scripts:
      - scripts/manage_models.py
      - scripts/download_model.sh
      - scripts/ee_smoke_test.sh
      - scripts/prune_podman_cache.sh
      - mcp-ai/install_git_watcher_service.sh

  tasks:
    - name: Ensure Python and pip present
      package:
        name:
          - python3
          - python3-pip
        state: present

    - name: Ensure mcp-ai system user exists
      user:
        name: mcp-ai
        system: true
        create_home: true
        shell: /sbin/nologin

    - name: Ensure /home/mcp-ai/.mcp-ai exists
      file:
        path: /home/mcp-ai/.mcp-ai
        state: directory
        owner: mcp-ai
        group: mcp-ai
        mode: '0750'

    - name: Ensure /var/lib/mcp-llms exists
      file:
        path: /var/lib/mcp-llms
        state: directory
        owner: mcp-ai
        group: mcp-ai
        mode: '0750'

    - name: Copy tmpfiles and systemd unit files
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: '0644'
      loop: "{{ mcp_install_paths }}"

    - name: Copy scripts to /usr/local/bin
      copy:
        src: "{{ item }}"
        dest: "/usr/local/bin/{{ item | basename }}"
        owner: root
        group: root
        mode: '0755'
      loop: "{{ scripts }}"

    - name: Install supplemental-training Python dependencies (pip)
      pip:
        name:
          - requests
          - pypdf
          - python-docx
          - beautifulsoup4
        state: present
      become: true
      ignore_errors: true

    - name: Install git-watcher service for mcp-ai user (user-level service)
      become: true
      become_user: mcp-ai
      environment:
        HOME: /home/mcp-ai
      command: /usr/local/bin/install_git_watcher_service.sh
      args:
        chdir: /home/mcp-ai
      register: git_watcher_install
      failed_when: false
      changed_when: false

    - name: Reload systemd
      command: systemctl daemon-reload

    - name: Create tmpfiles entries
      command: systemd-tmpfiles --create /etc/tmpfiles.d/mcp-llms.conf

    - name: Enable and start model cleanup timer
      systemd:
        name: mcp-model-cleanup.timer
        enabled: true
        state: started

    - name: Show status of mcp-model-cleanup.timer
      command: systemctl status mcp-model-cleanup.timer --no-pager
      register: timer_status
      ignore_errors: true

    - name: Print timer status
      debug:
        var: timer_status.stdout_lines
