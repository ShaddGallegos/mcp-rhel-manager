---
- name: Ensure monitoring directory exists
  file:
    path: "{{ monitoring_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install container runtime packages (podman/docker shim)
  become: true
  package:
    name:
      - podman
      - podman-docker
      - podman-compose
      - docker-compose-plugin
    state: present
  ignore_errors: true

- name: Check for docker CLI availability
  command: docker --version
  register: has_docker
  failed_when: false
  changed_when: false

- name: Check for podman-compose availability
  command: podman-compose --version
  register: has_podman_compose
  failed_when: false
  changed_when: false

- name: Optionally install Docker CE on RedHat systems
  block:
    - name: Ensure dnf-plugins-core present
      package:
        name: dnf-plugins-core
        state: present

    - name: Add Docker CE repo via dnf config-manager
      command: dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
      args:
        warn: false
      register: add_repo_res
      failed_when: false

    - name: Install Docker CE packages
      package:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present

    - name: Ensure docker service is enabled and started
      service:
        name: docker
        enabled: true
        state: started
  when: monitoring_install_docker | default(false) and ansible_facts['os_family'] == 'RedHat'
  become: true
  ignore_errors: true

- name: Skip Docker CE install on Debian/Ubuntu systems by policy
  debug:
    msg: >-
      Debian/Ubuntu Docker CE install is intentionally disabled for this role
      to enforce RHEL-only policy.
  when: monitoring_install_docker | default(false) and ansible_facts['os_family'] != 'RedHat'

- name: Copy monitoring assets to target
  copy:
    src: monitoring/
    dest: "{{ monitoring_dir }}/"
    owner: root
    group: root
    mode: '0644'
    recurse: true

- name: Create monitoring .env file with Grafana credentials (optional)
  copy:
    dest: "{{ monitoring_dir }}/.env"
    content: |
      GRAFANA_ADMIN_USER={{ grafana_admin_user }}
      GRAFANA_ADMIN_PASSWORD={{ grafana_admin_password }}
    owner: root
    group: root
    mode: '0600'
  when: monitoring_install_grafana and (grafana_admin_password is defined and grafana_admin_password != '')

- name: Try to start monitoring via docker compose
  become: true
  block:
    - name: Start via docker compose (if docker present)
      command: docker compose up -d
      args:
        chdir: "{{ monitoring_dir }}"
      when: has_docker.rc == 0

    - name: Start via podman-compose (if available)
      command: podman-compose up -d
      args:
        chdir: "{{ monitoring_dir }}"
      when: has_podman_compose.rc == 0 and has_docker.rc != 0
  rescue:
    - name: Set dc_failed
      set_fact:
        dc_failed: true
  always:
    - name: Set dc_res rc
      set_fact:
        dc_res: "{{ dc_failed | default(false) }}"
  register: dc_res
  failed_when: false
  changed_when: dc_res.rc == 0

- name: Warn if docker compose failed to start
  debug:
    msg: >-
      Docker compose failed or is unavailable on target. Monitoring assets were
      copied to {{ monitoring_dir }}. Start services manually or ensure Docker
      and docker-compose plugin are installed.
  when: dc_res.rc != 0
