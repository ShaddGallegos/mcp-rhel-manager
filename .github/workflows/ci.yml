name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Byte-compile repository
        run: python -m compileall -q .
      - name: Run tests
        run: |
          pytest -q tests/test_ingest_utils.py tests/test_auto_ingest.py tests/test_ingest_common.py \
            tests/test_approvals_api.py tests/test_dashboard_approve.py
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff black
      - name: Run ruff
        run: ruff check .
      - name: Run black check
        run: black --check . || true

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest ruff

      - name: Lint with ruff
        run: ruff check . || true

      - name: Run tests
        run: python -m pytest -q || true

  ee-smoke:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install ansible-core
        run: |
          python -m pip install --upgrade pip
          pip install 'ansible-core>=2.20.0' prometheus_client
      - name: Run EE smoke test
        run: |
          bash -c 'bash scripts/ee_smoke_test.sh'

  ee-build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install ansible-builder
        run: |
          python -m pip install --upgrade pip
          pip install ansible-builder
      - name: Build Execution Environment (docker)
        env:
          ANSIBLE_BUILDER_CONTAINERFILE: path/to/execution-environment.yml
        run: |
          # Attempt to build the execution environment using Docker. May require runner privileges.
          ansible-builder build --container-runtime docker --tag mcp-ee:latest -v -f path/to/execution-environment.yml || true

  auto_pr:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Run HAL auto-improve to generate suggestions
        run: |
          python3 scripts/hal_auto_improve.py --root . --apply

      - name: Commit and push suggestions branch
        run: |
          if [ -d .hal_suggestions/patches ] && [ "$(ls -A .hal_suggestions/patches || true)" != "" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            BRANCH="mcp-suggestions-${{ github.run_id }}"
            git checkout -b "$BRANCH"
            git add .hal_suggestions/patches || true
            git commit -m "MCP auto suggestions" || true
            git push -u origin "$BRANCH"
            echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          else
            echo "No suggestions to push"
            exit 0
          fi

      - name: Create Draft PR via GitHub API
        uses: actions/github-script@v6
        with:
          script: |
            const branch = process.env.BRANCH
            if (!branch) {
              core.setFailed('Branch environment variable not set');
            }
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'MCP auto suggestions',
              head: branch,
              base: 'main',
              body: 'Automated suggestions generated by HAL auto-improve. Review before merge.',
              draft: true
            })
            core.setOutput('pr_url', pr.data.html_url)
