name: Detect Secrets

on:
  push:
  pull_request:

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install detect-secrets
        run: |
          python -m pip install --upgrade pip
          pip install "detect-secrets>=1.6"
      - name: Run detect-secrets scan (all files)
        run: |
          echo "Running detect-secrets scan --all-files"
          detect-secrets scan --all-files || true
          # Use exit code to fail only if findings are non-empty
          detect-secrets scan --all-files | tee /tmp/detect_output.txt
          if grep -q "Potential secrets found" /tmp/detect_output.txt || [ -s /tmp/detect_output.txt ]; then
            echo "Potential secrets detected. Failing workflow."
            exit 1
          fi
