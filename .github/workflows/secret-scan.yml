name: Secret Scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: [self-hosted, rhel]
    steps:
      - uses: actions/checkout@v4
      - name: Quick secret scan (heuristic)
        run: |
          set -euo pipefail
          echo "Scanning tracked files for high-confidence secret patterns..."
          files=$(git ls-files)
          # Only scan code/config files to reduce false positives
          echo "$files" | grep -E '\.py$|\.yml$|\.yaml$|\.json$|\.env$|\.cfg$|\.ini$|\.sh$' > /tmp/scan_files || true
          if [ ! -s /tmp/scan_files ]; then
            echo "No candidate files to scan."
            exit 0
          fi
          patterns='(BEGIN RSA PRIVATE KEY|BEGIN OPENSSH PRIVATE KEY|ghp_[A-Za-z0-9_]+|AKIA[0-9A-Z]{16}|AWS_SECRET_ACCESS_KEY|aws_secret|client_secret|PGPASSWORD|password\s*[:=]\s*"?.{6,}"?)'
          hits=0
          while read -r f; do
            if grep -E -n "$patterns" "$f" >/dev/null 2>&1; then
              echo "Potential secret(s) found in: $f"
              grep -E -n "$patterns" "$f" || true
              hits=$((hits+1))
            fi
          done < /tmp/scan_files
          if [ "$hits" -gt 0 ]; then
            echo "Secret scan detected $hits possible issues. Review and fix before merging."
            exit 1
          fi
          echo "No high-confidence secrets detected."
        shell: bash
