repos:
  - repo: local
    hooks:
      - id: secret-scan
        name: mcp-ai secret scanner
        entry: python mcp-ai/secret_scan.py
        language: system
        stages: [commit]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
