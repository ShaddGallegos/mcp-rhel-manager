groups:
  - name: mcp.rules
    rules:
      - alert: MCPReadinessFailed
        expr: mcp_ready == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "MCP readiness probe failing (mcp_ready == 0)"
          description: "The MCP dashboard readiness endpoint reports non-ready state for more than 2 minutes. Check /health/ready and disk/model availability."

      - alert: MCPDiskLow
        expr: mcp_disk_free_bytes < (100 * 1024 * 1024)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on MCP host"
          description: "Available disk space is below 100MB. Free disk: {{ $value }} bytes."
